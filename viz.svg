<svg xmlns="http://www.w3.org/2000/svg" width="760" height="498" viewBox="0 0 760 498" role="img" aria-label="Step-by-step visual walkthrough">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="context-stroke"/></marker></defs>
<rect x="1.0" y="1.0" width="758.0" height="496.0" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="24.0" y="34.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#1e293b" text-anchor="start" font-weight="600">Detect a Cycle — the hare must lap the tortoise</text>
<circle cx="35.0" cy="74.0" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
<text x="35.0" y="78.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">1</text>
<text x="56.0" y="79.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Does the list loop? The tail points back to node 2, so a plain walk would never end.</text>
<text x="56.0" y="98.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">O(1) memory allowed — no visited set.</text>
<rect x="24.0" y="128.0" width="54.0" height="36.0" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="51.0" y="151.0" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#1e293b" text-anchor="middle">1</text>
<line x1="78.0" y1="146.0" x2="102.0" y2="146.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="108.0" y="128.0" width="54.0" height="36.0" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="135.0" y="151.0" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#1e293b" text-anchor="middle">2</text>
<line x1="162.0" y1="146.0" x2="186.0" y2="146.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="192.0" y="128.0" width="54.0" height="36.0" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="219.0" y="151.0" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#1e293b" text-anchor="middle">3</text>
<path d="M 219 126 Q 177 94 135 126" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="177.0" y="98.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">loops back</text>
<line x1="24.0" y1="178.0" x2="736.0" y2="178.0" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="35.0" cy="198.0" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
<text x="35.0" y="202.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">2</text>
<text x="56.0" y="203.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Send slow (1 step) and fast (2 steps). If there's no cycle, fast falls off the end.</text>
<text x="56.0" y="222.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Inside a cycle, the gap between them shrinks by exactly one node per step...</text>
<rect x="24.0" y="252.0" width="54.0" height="36.0" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="51.0" y="275.0" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#1e293b" text-anchor="middle">1</text>
<line x1="78.0" y1="270.0" x2="102.0" y2="270.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="108.0" y="252.0" width="54.0" height="36.0" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="135.0" y="275.0" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#1e293b" text-anchor="middle">2</text>
<line x1="162.0" y1="270.0" x2="186.0" y2="270.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="192.0" y="252.0" width="54.0" height="36.0" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="219.0" y="275.0" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#1e293b" text-anchor="middle">3</text>
<path d="M 219 250 Q 177 218 135 250" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="135.0" y1="314.0" x2="135.0" y2="294.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="135.0" y="328.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="600">slow</text>
<line x1="219.0" y1="314.0" x2="219.0" y2="294.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="219.0" y="328.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="600">fast</text>
<line x1="24.0" y1="344.0" x2="736.0" y2="344.0" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="35.0" cy="364.0" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
<text x="35.0" y="368.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">3</text>
<text x="56.0" y="369.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">...so fast must land ON slow — it can never skip over. Meeting proves the cycle.</text>
<text x="56.0" y="388.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">(Where the cycle STARTS is the sequel, dsa-035.)</text>
<rect x="24.0" y="418.0" width="54.0" height="36.0" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="51.0" y="441.0" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#1e293b" text-anchor="middle">1</text>
<line x1="78.0" y1="436.0" x2="102.0" y2="436.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="108.0" y="418.0" width="54.0" height="36.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="135.0" y="441.0" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#1e293b" text-anchor="middle">2</text>
<line x1="162.0" y1="436.0" x2="186.0" y2="436.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="192.0" y="418.0" width="54.0" height="36.0" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="219.0" y="441.0" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#1e293b" text-anchor="middle">3</text>
<path d="M 219 416 Q 177 384 135 416" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="380.0" y="480.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">github.com/Sreenivas-Sadhu-Prabhakara · dsa series</text>
</svg>